{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RadioLive</title>
    <link rel="stylesheet" href="{% static 'radio/app.css' %}">
</head>
<body>
<header class="header">
    <h1>Login</h1>
    <p>Sign in to keep favorites in your account.</p>
</header>

<main class="container">
    <section class="auth-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        <p><a href="{% url 'home' %}">Back to home</a></p>
    </section>
</main>
</body>
</html>
